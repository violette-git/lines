# Builds an installable Android APK on every push to main (no Expo account needed).
# Download it from the run's "Artifacts" section and open it on an Android phone.
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is preset), so no setup action is needed.
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linemap-pro-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish to the "latest" release (stable download link for phones)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" LineMapPro.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest Android build" --notes "Built automatically from main. Install LineMapPro.apk on an Android phone."
          gh release upload latest LineMapPro.apk --clobber
          gh release edit latest --notes "Built automatically from main at ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). Install LineMapPro.apk on an Android phone."
